services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: novastart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novastart"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      # Docker 网络内的连接串（覆盖 .env / 默认值，pydantic-settings 环境变量优先）
      DATABASE_URL: postgresql+psycopg://postgres:dev@postgres:5432/novastart
      LLM_PROVIDER: mock
      CLOCK_MODE: normal
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
